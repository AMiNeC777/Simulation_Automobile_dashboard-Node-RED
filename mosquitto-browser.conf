# WebSocket door for the browser while the Windows Mosquitto service
# already owns MQTT on 127.0.0.1:1883. This process only listens on 9001
# and forwards moulage/# both ways to that service.
listener 9001 127.0.0.1
protocol websockets
socket_domain ipv4

allow_anonymous true

connection to-service
address 127.0.0.1:1883
bridge_protocol_version mqttv311
cleansession true
notifications false
try_private true
start_type automatic
topic moulage/# both 0
