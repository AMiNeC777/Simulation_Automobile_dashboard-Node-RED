# One broker, two listeners. Node-RED uses 1883. The browser uses 9001.
# On Windows the websocket listener must be IPv4, or it never opens.
# Stop the Windows service "Mosquitto Broker" before starting this file,
# because that service already occupies port 1883.
# If the service must stay running, use mosquitto-browser.conf instead.
listener 1883 127.0.0.1
protocol mqtt
socket_domain ipv4

listener 9001 127.0.0.1
protocol websockets
socket_domain ipv4

allow_anonymous true
